[workspace]
resolver = "2"
members = [
    "crates/rpc",
    "crates/rpc_macros",
    "crates/client_macros",
    "crates/server",
    "crates/client",
    "crates/capture",
    "crates/streaming_common",
    "crates/simulation",
]

default-members = ["crates/client"]

[workspace.dependencies]
rpc = { path = "crates/rpc" }

rpc_macros = { path = "crates/rpc_macros" }
client_macros = { path = "crates/client_macros" }

capture = { path = "crates/capture" }
streaming_common = { path = "crates/streaming_common" }

client = { path = "crates/client" }
server = { path = "crates/server" }

log = "0.4.29"
anyhow = "1.0.100"
env_logger = "0.11.8"
rmp-serde = "1.3.1"
bytes = "1.11.0"
thiserror = "2.0"
crossbeam = "0.8.4"
atomic_float = "1.1.0"
ringbuf = "0.5"
smol = "2.0.2"
reed-solomon-simd = "3.1.0"
ffmpeg-next = "9.0.0"

# UI
gpui = { rev = "137f6c7395f3aeb57118eb6950d06c2a5f5475cf", git = "https://github.com/TaPO4eg3D/zed.git", features = [
    "wayland",
    "windows-manifest",
    "x11",
] }
gpui_platform = { rev = "137f6c7395f3aeb57118eb6950d06c2a5f5475cf", git = "https://github.com/TaPO4eg3D/zed.git", features=[
    "font-kit",
    "wayland",
    "x11"
] }

gpui-component = { rev = "84ae29e0647486b7cc3f74f40cdc42aae0f62f7a", git = "https://github.com/TaPO4eg3D/gpui-component.git" }


# Quite a sophisticated profiler. Disabled by default (`enable` feature)
[workspace.dependencies.tracy-client]
version = "0.18.4"
default-features = false
features = [
    "system-tracing",
    "context-switch-tracing",
    "sampling",
    "code-transfer",
    "broadcast",
    "callstack-inlines",
    "crash-handler"
]

[workspace.dependencies.tokio]
version = "1.49.0"
features = [
    "net",
    "io-util",
    "time",
    "sync",
    "rt-multi-thread",
    "macros",
]

[workspace.dependencies.sea-orm]
version = "2.0.0-rc.27"
features = [
    "sqlx-sqlite",
    "entity-registry",
    "schema-sync",
    "runtime-tokio-rustls",
]

[workspace.dependencies.serde]
version = "1.0.228"
features = ["derive"]

[profile.profiling]
inherits = "release"
debug = true
